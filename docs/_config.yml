title: StoreGate
description: >-
  Avoid common App Store and Google Play rejections. An open playbook and pre-submission guard with
  rejection patterns and fixes, privacy manifest and Data safety checks, and tracked
  deadlines across jurisdictions and platform scopes.
url: https://taigashinohara.github.io
baseurl: /StoreGate
lang: en
theme: jekyll-theme-primer
author: Taiga Shinohara
github_username: TaigaShinohara
social:
  name: Taiga Shinohara
  links:
    - https://github.com/TaigaShinohara
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  strip_title: true
include:
  - llms.txt
